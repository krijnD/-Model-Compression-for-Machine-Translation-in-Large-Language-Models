[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtcompress"
version = "1.0.0"
description = "Low-bit GPTQ quantization of ALMA-13B-R and adapter distillation for multilingual MT"
requires-python = ">=3.9"
# Dependencies are pinned in requirements.txt (evaluation) and requirements-quant.txt (GPTQ, distillation).

[tool.setuptools]
packages = ["mtcompress"]
